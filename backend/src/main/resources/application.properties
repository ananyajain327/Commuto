spring.application.name=Commuto Backend

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./commuto_data;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PORT:8080}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

app.jwt.secret=${JWT_SECRET:commuto-super-secret-jwt-key-with-at-least-32-chars-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Google OAuth Setup
app.google.client-id=${GOOGLE_CLIENT_ID:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true