name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: commuto_ci
          DB_USERNAME: commuto
          DB_PASSWORD: ci-only-db-password
          JWT_SECRET: ci-only-jwt-secret-value-at-least-32-bytes
          APP_CORS_ALLOWED_ORIGINS: https://app.example.invalid
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: docker compose config --quiet